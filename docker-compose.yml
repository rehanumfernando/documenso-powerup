services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: documenso
    volumes:
      - documenso-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - documenso-internal

  documenso:
    build:
      context: https://github.com/rehanumfernando/documenso-powerup.git#main
      dockerfile: docker/Dockerfile
      args:
        NEXT_PRIVATE_ENCRYPTION_KEY: ${NEXT_PRIVATE_ENCRYPTION_KEY}
        NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY}
        NEXT_PUBLIC_BASE_PATH: ""
    image: documenso-powerup:local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000

      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${NEXT_PRIVATE_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY}

      NEXT_PUBLIC_WEBAPP_URL: https://sign.powerupsolutions.lk
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000

      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${POSTGRES_PASSWORD}@database:5432/documenso

      NEXT_PUBLIC_UPLOAD_TRANSPORT: database

      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${NEXT_PRIVATE_SIGNING_PASSPHRASE}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS:-}

      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mail.powerupsolutions.lk
      NEXT_PRIVATE_SMTP_PORT: 587
      NEXT_PRIVATE_SMTP_USERNAME: sign@powerupsolutions.lk
      NEXT_PRIVATE_SMTP_PASSWORD: ${NEXT_PRIVATE_SMTP_PASSWORD}
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_FROM_NAME: Documenso (Do Not Reply)
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: sign@powerupsolutions.lk

      NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT: 25
      NEXT_PUBLIC_DISABLE_SIGNUP: "false"
      NEXT_PRIVATE_JOBS_PROVIDER: local
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - documenso-internal
      - dokploy-network

networks:
  documenso-internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  documenso-database:
